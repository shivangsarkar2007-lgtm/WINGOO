services:
  - type: web
    name: wingoo
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wingoo-db
          property: connectionString
    plan: free

databases:
  - name: wingoo-db
    plan: free
