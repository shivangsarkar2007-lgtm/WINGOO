<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINGOO — Messages That Travel</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#0b0b10;--card:#14151d;--line:#2b2c35;--text:#f5f1e8;--muted:#9996a0;--gold:#e6c27e;--gold2:#a7793f;--green:#76d49e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#282015,#0b0b10 40%);color:var(--text);font:15px system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{border-right:1px solid var(--line);padding:24px 16px}.logo{font-weight:900;letter-spacing:4px;font-size:20px;margin:4px 8px 35px}.logo span{font-size:25px}.nav{display:block;width:100%;padding:12px;margin:5px 0;border:0;border-radius:11px;background:transparent;color:#aaa;text-align:left;cursor:pointer}.nav.active,.nav:hover{background:#1b1c24;color:#fff}.main{min-width:0}.head{height:88px;padding:20px 35px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:25px}.page{padding:30px 35px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.card{background:#12131a;border:1px solid var(--line);border-radius:18px;padding:20px}.map{min-height:480px;border-radius:18px;background:radial-gradient(circle,#30291c,#11131a 60%);position:relative;overflow:hidden;border:1px solid var(--line)}.map:before{content:"";position:absolute;inset:-20%;background:linear-gradient(30deg,transparent 49.7%,#b2955b22 50%,transparent 50.3%),linear-gradient(-25deg,transparent 49.7%,#b2955b22 50%,transparent 50.3%)}.node{position:absolute;background:#171820eF;border:1px solid #454047;border-radius:13px;padding:9px;text-align:center;cursor:pointer;color:#fff}.node span{display:block;font-size:28px}.you{left:47%;top:45%;border-color:#765a32}.r{left:15%;top:17%}.a{right:15%;top:25%}.n{left:13%;bottom:18%}.as{right:13%;bottom:16%}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.stat{padding:15px;border:1px solid var(--line);border-radius:14px;background:#12131a}.stat small{display:block;color:var(--muted)}.stat b{font-size:20px}.search{display:flex;gap:8px}.input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#191a22;color:#fff;outline:0}.btn{border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold2));font-weight:800}.ghost{background:#1b1c24;color:#fff;border:1px solid var(--line)}.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px}.row:hover{background:#1a1b23}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#2a2931}.spacer{margin-left:auto}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(420px,100%);background:#12131a;border:1px solid var(--line);border-radius:22px;padding:30px}.authbox h1{text-align:center;letter-spacing:3px}.authbox label{display:block;color:var(--muted);font-size:12px;margin:14px 0}.authbox input{margin-top:6px}.chat{height:520px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:75%;padding:10px 12px;border-radius:14px;background:#22232c}.me{align-self:flex-end;background:#5c472a}.composer{display:flex;gap:7px;border-top:1px solid var(--line);padding-top:12px}.flight{position:fixed;inset:0;background:#000a;backdrop-filter:blur(7px);display:none;place-items:center;z-index:5}.flight.show{display:grid}.flightbox{width:min(650px,calc(100% - 30px));background:#12131a;border:1px solid #55462e;border-radius:22px;padding:28px}.track{height:65px;border-top:1px dashed #67573a;border-bottom:1px dashed #67573a;position:relative;margin:30px 0}.bird{position:absolute;left:0;top:12px;font-size:30px;transition:2.5s}.bar{height:6px;background:#282933;border-radius:9px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:2.5s}.toast{position:fixed;right:18px;bottom:18px;background:#f2ead9;color:#17130d;padding:11px 14px;border-radius:10px;display:none}.toast.show{display:block}@media(max-width:800px){.app{grid-template-columns:70px 1fr}.side{padding:20px 8px}.logo{font-size:0;text-align:center}.logo span{font-size:25px}.nav{font-size:0;text-align:center}.nav:first-letter{font-size:20px}.head,.page{padding-left:15px;padding-right:15px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div id="auth" class="auth"><div class="authbox"><h1>🕊️ WINGOO</h1><p style="text-align:center;color:var(--muted)">Messages that travel.</p><div id="authForm"></div></div></div>
<div id="app" class="app" style="display:none"><aside class="side"><div class="logo"><span>🕊️</span> WINGOO</div><button class="nav active" data-page="network">🗺️ Network</button><button class="nav" data-page="chats">💬 Chats</button><button class="nav" data-page="friends">👥 Friends</button><button class="nav" data-page="profile">🏰 Castle</button><button class="nav" id="logout">🚪 Logout</button></aside>
<main class="main"><header class="head"><div><small style="color:#777">YOUR PRIVATE NETWORK</small><h1 id="title">Pigeon Network</h1></div><div id="meAvatar" class="avatar">S</div></header><div class="page" id="page"></div></main></div>
<div class="flight" id="flight"><div class="flightbox"><button id="close" class="btn ghost spacer" style="float:right">×</button><small style="color:var(--gold)">🕊️ PIGEON DELIVERY</small><h2 id="flightTitle">Your pigeon has departed.</h2><div class="track"><div class="bird" id="bird">🕊️</div></div><div class="bar"><i id="bar"></i></div><p id="flightText" style="color:var(--muted)">Making the journey…</p></div></div><div id="toast" class="toast"></div>
<script>
let token=localStorage.getItem("wingooToken"), me=null, friends=[], current=null, socket=null, pigeon=localStorage.getItem("wingooPigeon")||"classic";
const pigeons={classic:"🕊️",royal:"👑🕊️",night:"🖤🕊️",spark:"⚡🕊️",snow:"❄️🕊️",fire:"🔥🕊️"};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){let x=$("#toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),"Content-Type":"application/json",Authorization:"Bearer "+token};let r=await fetch(path,opt),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
function authUI(){let mode="login";const f=$("#authForm");function draw(){f.innerHTML=`<h3>${mode==="login"?"Welcome back":"Create your castle"}</h3>${mode==="register"?'<label>Display name<input id="display" class="input" placeholder="Shivang"></label>':''}<label>Username<input id="username" class="input" placeholder="@yourname"></label><label>Password<input id="password" type="password" class="input" placeholder="Minimum 6 characters"></label><button id="authBtn" class="btn" style="width:100%;margin-top:8px">${mode==="login"?"Enter WINGOO":"Create account"}</button><button id="switch" class="btn ghost" style="width:100%;margin-top:8px">${mode==="login"?"Create a new account":"I already have an account"}</button>`;$("#authBtn").onclick=async()=>{try{let body={username:$("#username").value,password:$("#password").value};if(mode==="register")body.displayName=$("#display").value;let d=await fetch("/api/auth/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());if(!d.token)throw Error(d.error);token=d.token;localStorage.setItem("wingooToken",token);await boot()}catch(e){toast(e.message)}};$("#switch").onclick=()=>{mode=mode==="login"?"register":"login";draw()}}draw()}
async function boot(){if(!token){$("#auth").style.display="grid";$("#app").style.display="none";authUI();return}try{let d=await api("/api/me");me=d.user;$("#auth").style.display="none";$("#app").style.display="grid";$("#meAvatar").textContent=me.avatar||me.displayName[0].toUpperCase();connectSocket();loadPage("network")}catch(e){localStorage.removeItem("wingooToken");token=null;authUI()}}
function connectSocket(){if(socket)socket.disconnect();socket=io({auth:{token}});socket.on("message:new",m=>{toast("🕊️ New message from @"+m.sender);if(current&&current.username===m.sender)loadChat(current.username)})}
async function loadPage(page){document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===page));$("#title").textContent={network:"Pigeon Network",chats:"Chats",friends:"Friends",profile:"My Castle"}[page];if(page==="network")network();if(page==="chats")chats();if(page==="friends")friendsPage();if(page==="profile")profile()}
async function network(){await refreshFriends();$("#page").innerHTML=`<div class="grid"><div class="card"><small style="color:var(--gold)">🕊️ LIVE NETWORK</small><h2>Every friend is a castle.</h2><p style="color:var(--muted);line-height:1.6">Real accounts and protected locations now power your network.</p><button class="btn" id="loc">📍 Share location</button></div><div class="map"><div class="node you">🏰<b>${esc(me.displayName)}</b><small>you</small></div>${friends.map((f,i)=>`<button class="node ${["r","a","n","as"][i%4]}" data-user="${esc(f.username)}">🏠<b>${esc(f.displayName)}</b><small>${f.distance==null?"distance hidden":"~"+f.distance+" km"}</small></button>`).join("")}</div></div><div class="stats"><div class="stat">🕊️<small>Friends</small><b>${friends.length}</b></div><div class="stat">📍<small>Location</small><b>${me.locationVisibility==="hidden"?"Hidden":"Private"}</b></div><div class="stat">💬<small>Realtime</small><b>ON</b></div><div class="stat">🔐<small>Exact coords</small><b>Private</b></div></div>`;$("#loc").onclick=shareLocation;document.querySelectorAll("[data-user]").forEach(x=>x.onclick=()=>{current=friends.find(a=>a.username===x.dataset.user);loadPage("chats")})}
async function refreshFriends(){friends=(await api("/api/friends")).friends}
async function friendsPage(){
  await refreshFriends();

  let incoming=[];
  try{
    incoming=(await api("/api/friend-requests")).requests||[];
  }catch(e){
    console.error("Could not load incoming friend requests:",e);
  }

  const render=()=>{
    $("#page").innerHTML=`
      ${incoming.length?`<div class="card request-card"><h2>📨 Friend requests <span style="color:var(--gold)">(${incoming.length})</span></h2>
        ${incoming.map(r=>`<div class="row">
          <div class="avatar">${r.avatar||r.display_name[0]}</div>
          <div><b>${esc(r.display_name)}</b><small style="display:block;color:var(--muted)">@${esc(r.username)}</small></div>
          <div class="request-actions">
            <button class="btn" data-accept="${esc(r.username)}">Accept</button>
          </div>
        </div>`).join("")}
      </div>`:""}

      <div class="card" style="margin-top:15px">
        <h2>Find a friend</h2>
        <div class="search">
          <input id="q" class="input" placeholder="@username">
          <button class="btn" id="search">Search</button>
        </div>
        <div id="results"></div>
      </div>

      <div class="card" style="margin-top:15px">
        <h2>Your circle</h2>
        ${friends.map(f=>`<div class="row">
          <div class="avatar">${f.avatar||f.displayName[0]}</div>
          <div>
            <b>${esc(f.displayName)}</b>
            <small style="display:block;color:var(--muted)">
              @${esc(f.username)} · ${f.distance==null?"location hidden":f.distance+" km"}
            </small>
          </div>
          <button class="btn ghost spacer" data-chat="${esc(f.username)}">Message</button>
        </div>`).join("")||'<p style="color:var(--muted)">No accepted friends yet.</p>'}
      </div>`;

    document.querySelectorAll("[data-accept]").forEach(b=>b.onclick=async()=>{
      b.disabled=true;
      b.textContent="Accepting…";

      try{
        await api("/api/friends/accept",{
          method:"POST",
          body:JSON.stringify({username:b.dataset.accept})
        });

        toast("👥 Friend request accepted!");
        await friendsPage();
      }catch(e){
        b.disabled=false;
        b.textContent="Accept";
        toast(e.message);
      }
    });

    $("#search").onclick=async()=>{
      try{
        let d=await api("/api/users/search?q="+encodeURIComponent($("#q").value));

        $("#results").innerHTML=d.users.map(u=>`<div class="row">
          <div class="avatar">${u.avatar||u.displayName[0]}</div>
          <div>
            <b>${esc(u.displayName)}</b>
            <small style="display:block;color:var(--muted)">
              @${esc(u.username)} ${u.distance!=null?"· "+u.distance+" km":""}
            </small>
          </div>
          <button class="btn spacer" data-add="${esc(u.username)}">Add</button>
        </div>`).join("")||"<p style='color:var(--muted)'>No user found.</p>";

        document.querySelectorAll("[data-add]").forEach(b=>b.onclick=async()=>{
          try{
            await api("/api/friends/request",{
              method:"POST",
              body:JSON.stringify({username:b.dataset.add})
            });

            b.textContent="Requested ✓";
            b.disabled=true;
          }catch(e){
            if(e.message==="A request already exists."){
              b.textContent="Requested ✓";
              b.disabled=true;
            }
            toast(e.message);
          }
        });

      }catch(e){
        toast(e.message);
      }
    };

    document.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>{
      current=friends.find(x=>x.username===b.dataset.chat);
      loadPage("chats");
    });
  };

  render();
}await refreshFriends();$("#page").innerHTML=`<div class="card"><h2>Find a friend</h2><div class="search"><input id="q" class="input" placeholder="@username"><button class="btn" id="search">Search</button></div><div id="results"></div></div><div class="card" style="margin-top:15px"><h2>Your circle</h2>${friends.map(f=>`<div class="row"><div class="avatar">${f.avatar||f.displayName[0]}</div><div><b>${esc(f.displayName)}</b><small style="display:block;color:var(--muted)">@${esc(f.username)} · ${f.distance==null?"location hidden":f.distance+" km"}</small></div><button class="btn ghost spacer" data-chat="${esc(f.username)}">Message</button></div>`).join("")||'<p style="color:var(--muted)">No accepted friends yet.</p>'}</div>`;$("#search").onclick=async()=>{try{let d=await api("/api/users/search?q="+encodeURIComponent($("#q").value));$("#results").innerHTML=d.users.map(u=>`<div class="row"><div class="avatar">${u.avatar||u.displayName[0]}</div><div><b>${esc(u.displayName)}</b><small style="display:block;color:var(--muted)">@${esc(u.username)} ${u.distance!=null?"· "+u.distance+" km":""}</small></div><button class="btn spacer" data-add="${esc(u.username)}">Add</button></div>`).join("")||"<p style='color:var(--muted)'>No user found.</p>";document.querySelectorAll("[data-add]").forEach(b=>b.onclick=async()=>{try{await api("/api/friends/request",{method:"POST",body:JSON.stringify({username:b.dataset.add})});b.textContent="Requested ✓";b.disabled=true}catch(e){toast(e.message)}})}catch(e){toast(e.message)}};document.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>{current=friends.find(x=>x.username===b.dataset.chat);loadPage("chats")})}
async function chats(){await refreshFriends();if(!current)current=friends[0];$("#page").innerHTML=`<div class="grid"><div class="card">${friends.map(f=>`<div class="row" data-open="${f.username}"><div class="avatar">${f.avatar||f.displayName[0]}</div><div><b>${esc(f.displayName)}</b><small style="display:block;color:var(--muted)">@${esc(f.username)}</small></div></div>`).join("")||"<p style='color:var(--muted)'>Add a friend first.</p>"}</div><div class="card chat" id="chat"></div></div>`;document.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>{current=friends.find(f=>f.username===x.dataset.open);loadChat(current.username)});if(current)loadChat(current.username)}
async function loadChat(username){current=friends.find(f=>f.username===username)||current;let d=await api("/api/messages/"+encodeURIComponent(username));$("#chat").innerHTML=`<div><b>${esc(current.displayName)}</b><small style="display:block;color:var(--green)">${current.distance==null?"location hidden":current.distance+" km away"}</small></div><div class="messages">${d.messages.map(m=>`<div class="bubble ${m.sender===me.username?"me":""}">${esc(m.body)}<small style="display:block;color:#999">${m.pigeon_id} · ${new Date(m.created_at+"Z").toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</small></div>`).join("")}</div><div class="composer"><input id="msg" class="input" placeholder="Write a message…"><button class="btn" id="send">Send ${pigeons[pigeon]}</button></div>`;$("#send").onclick=send;$("#msg").onkeydown=e=>{if(e.key==="Enter")send()}}
async function send(){let x=$("#msg").value.trim();if(!x||!current)return;try{await api("/api/messages",{method:"POST",body:JSON.stringify({username:current.username,body:x,pigeonId:pigeon})});$("#msg").value="";showFlight(current);loadChat(current.username)}catch(e){toast(e.message)}}
function showFlight(f){$("#flightTitle").textContent="Your pigeon has departed.";$("#flightText").textContent="Flying to "+f.displayName+"…";$("#bird").textContent=pigeons[pigeon];$("#bird").style.left="0";$("#bar").style.width="0";$("#flight").classList.add("show");setTimeout(()=>{$("#bird").style.left="90%";$("#bar").style.width="100%"},100);setTimeout(()=>{$("#flightText").textContent="Delivered ✨";toast("🕊️ Delivered to "+f.displayName);setTimeout(()=>$("#flight").classList.remove("show"),700)},2700)}
async function profile(){let d=await api("/api/me");me=d.user;$("#page").innerHTML=`<div class="card" style="max-width:700px"><h2>🏰 ${esc(me.displayName)}</h2><p style="color:var(--muted)">@${esc(me.username)}</p><label style="display:block;margin:15px 0;color:var(--muted)">Display name<input id="name" class="input" value="${esc(me.displayName)}"></label><label style="display:block;margin:15px 0;color:var(--muted)">Location visibility<select id="vis" class="input"><option value="approximate">Approximate distance</option><option value="friends">Friends only</option><option value="hidden">Hidden</option></select></label><h3>🪶 Choose your pigeon</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${Object.entries(pigeons).map(([k,v])=>`<button class="btn ghost" data-pigeon="${k}">${v} ${k}</button>`).join("")}</div><button class="btn" id="save" style="margin-top:18px">Save castle</button></div>`;$("#vis").value=me.locationVisibility;document.querySelectorAll("[data-pigeon]").forEach(b=>b.onclick=()=>{pigeon=b.dataset.pigeon;localStorage.setItem("wingooPigeon",pigeon);toast("🪶 Pigeon selected")});$("#save").onclick=async()=>{try{let d=await api("/api/me",{method:"PATCH",body:JSON.stringify({displayName:$("#name").value,locationVisibility:$("#vis").value})});me=d.user;toast("🏰 Castle saved")}catch(e){toast(e.message)}}}
async function shareLocation(){if(!navigator.geolocation)return toast("Geolocation is unavailable.");navigator.geolocation.getCurrentPosition(async p=>{try{await api("/api/location",{method:"POST",body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude})});toast("📍 Location saved privately.");network()}catch(e){toast(e.message)}},()=>toast("Location permission denied."))}
document.querySelectorAll(".nav[data-page]").forEach(n=>n.onclick=()=>loadPage(n.dataset.page));$("#logout").onclick=()=>{localStorage.removeItem("wingooToken");location.reload()};$("#close").onclick=()=>$("#flight").classList.remove("show");boot();
</script></body></html>
