<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>WINGOO — Messages That Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0b0b10;
      --surface: #13141c;
      --surface-card: #191a24;
      --surface-hover: #212330;
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(230, 194, 126, 0.25);
      --text: #f5f1e8;
      --muted: #8b8894;
      --accent: #e6c27e;
      --accent-secondary: #a7793f;
      --accent-glow: rgba(230, 194, 126, 0.15);
      --green: #4ade80;
      --red: #f87171;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="sage"] {
      --accent: #76d49e;
      --accent-secondary: #3b8a5a;
      --accent-glow: rgba(118, 212, 158, 0.15);
      --border-accent: rgba(118, 212, 158, 0.25);
    }

    [data-theme="plum"] {
      --accent: #c084fc;
      --accent-secondary: #7e22ce;
      --accent-glow: rgba(192, 132, 252, 0.15);
      --border-accent: rgba(192, 132, 252, 0.25);
    }

    [data-theme="ocean"] {
      --accent: #38bdf8;
      --accent-secondary: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --border-accent: rgba(56, 189, 248, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: radial-gradient(circle at 80% 0%, var(--accent-glow), transparent 50%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

    /* Layout */
    .app { display: flex; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; }
    
    /* Sidebar (Desktop) */
    .side {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: var(--text);
      margin-bottom: 32px;
      padding: 0 8px;
    }
    .logo-icon { font-size: 24px; filter: drop-shadow(0 0 8px var(--accent-glow)); }

    .nav-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }

    .nav {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
    }
    .nav:hover { background: var(--surface-hover); color: var(--text); }
    .nav.active {
      background: var(--surface-card);
      color: var(--accent);
      border-color: var(--border-accent);
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .nav-icon { font-size: 18px; }

    .side-footer { border-top: 1px solid var(--border); padding-top: 16px; }

    /* Mobile Bottom Navigation */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(19, 20, 28, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      z-index: 100;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
    }
    .mobile-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      padding: 8px 0;
      transition: var(--transition);
    }
    .mobile-nav-btn.active { color: var(--accent); }
    .mobile-nav-btn span { font-size: 20px; }

    /* Main Area */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }

    .head {
      height: 70px;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 11, 16, 0.5);
      backdrop-filter: blur(10px);
    }
    .head h1 { font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: 0.3px; }
    .head-subtitle { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); font-weight: 700; margin-bottom: 2px; }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface-card);
      border: 1px solid var(--border-accent);
      display: grid;
      place-items: center;
      font-weight: 700;
      color: var(--accent);
      overflow: hidden;
      object-fit: cover;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .page { flex: 1; padding: 24px 28px; overflow-y: auto; }

    @keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .page.page-in > * { animation: pageIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Skeleton loading placeholders */
    .skel { background: linear-gradient(100deg, var(--surface-card) 30%, var(--surface-hover) 50%, var(--surface-card) 70%); background-size: 220% 100%; animation: skelShine 1.3s ease-in-out infinite; border-radius: var(--radius-sm); }
    @keyframes skelShine { to { background-position: -220% 0; } }
    .skel-row { display: flex; align-items: center; gap: 12px; padding: 12px; }
    .skel-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
    .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .skel-line { height: 10px; border-radius: 4px; }

    /* Empty states */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty-state .empty-icon { font-size: 34px; margin-bottom: 12px; opacity: 0.85; }
    .empty-state .empty-title { color: var(--text); font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .empty-state .empty-sub { font-size: 13px; max-width: 260px; line-height: 1.5; }

    /* Accessibility: visible focus */
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, .row[tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Shared Components & Layouts */
    .grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; height: 100%; }
    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      transition: var(--transition);
    }

    .btn {
      border: none;
      border-radius: var(--radius-md);
      padding: 10px 16px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: #0b0b10;
      font-weight: 700;
      font-size: 13px;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .btn.ghost {
      background: var(--surface-card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.ghost:hover { background: var(--surface-hover); border-color: var(--border-accent); }
    .btn.danger { background: rgba(248, 113, 113, 0.15); color: var(--red); border: 1px solid rgba(248, 113, 113, 0.3); }
    .btn.danger:hover { background: var(--red); color: #fff; }

    .input {
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface-card);
      color: var(--text);
      outline: none;
      font-size: 14px;
      transition: var(--transition);
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    .search { display: flex; gap: 8px; margin-top: 10px; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); transition: var(--transition); }
    .row:hover { background: var(--surface-hover); }
    .spacer { margin-left: auto; }

    /* Request Cards Highlight */
    .request-card {
      border-color: var(--border-accent);
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-card) 100%);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .request-badge {
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--border-accent);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }

    /* Auth View */
    .auth { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at center, var(--surface), var(--bg)); }
    .authbox { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .authbox h1 { font-family: var(--font-display); text-align: center; letter-spacing: 2px; font-size: 27px; font-weight: 600; margin-bottom: 4px; }
    .authbox label { display: block; color: var(--muted); font-size: 12px; margin: 14px 0 6px; font-weight: 600; }

    /* Map / Network View */
    .map {
      min-height: 480px;
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at center, #1b1c28 0%, #0e0f17 100%);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .map::before {
      content: "";
      position: absolute;
      inset: -50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
      opacity: 0.3;
    }
    .node {
      position: absolute;
      background: rgba(25, 26, 36, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      text-align: center;
      cursor: pointer;
      color: #fff;
      transition: var(--transition);
    }
    .node:hover { border-color: var(--accent); transform: scale(1.05); }
    .node.you { left: 45%; top: 40%; border-color: var(--accent); background: var(--surface-card); box-shadow: 0 0 15px var(--accent-glow); }
    .node.r { left: 15%; top: 20%; }
    .node.a { right: 15%; top: 25%; }
    .node.n { left: 20%; bottom: 20%; }
    .node.as { right: 20%; bottom: 20%; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
    .stat { padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
    .stat small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
    .stat b { font-size: 20px; color: var(--accent); margin-top: 4px; display: block; }

    /* Chat View */
    .chat-container { display: flex; flex-direction: column; height: 100%; }
    .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: var(--surface-card);
      border: 1px solid var(--border);
      align-self: flex-start;
      line-height: 1.4;
      font-size: 14px;
      word-break: break-word;
      animation: bubbleIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes bubbleIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .bubble.me {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(230, 194, 126, 0.15), rgba(167, 121, 63, 0.15));
      border-color: var(--border-accent);
      color: var(--text);
    }
    .bubble small { display: block; font-size: 10px; color: var(--muted); margin-top: 4px; text-align: right; }
    .composer { display: flex; gap: 8px; padding-top: 14px; border-top: 1px solid var(--border); }

    /* Castle / Profile Redesign */
    .castle-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .castle-avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .castle-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--surface-card);
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 800;
      color: var(--accent);
      overflow: hidden;
      object-fit: cover;
    }
    .castle-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .castle-avatar-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--accent);
      color: #0b0b10;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
      border: 2px solid var(--surface);
    }
    .castle-metrics {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 16px 0;
      width: 100%;
    }
    .metric { text-align: center; }
    .metric-val { font-size: 18px; font-weight: 800; color: var(--text); }
    .metric-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Modals & Overlays */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      place-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.show { display: grid; }
    .modal-card {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    /* Flight Modal */
    .flight { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); display: none; place-items: center; z-index: 2000; }
    .flight.show { display: grid; }
    .flightbox { width: min(500px, calc(100% - 40px)); background: var(--surface); border: 1px solid var(--border-accent); border-radius: var(--radius-lg); padding: 32px; position: relative; }
    .track { height: 60px; border-top: 1px dashed var(--border-accent); border-bottom: 1px dashed var(--border-accent); position: relative; margin: 24px 0; }
    .bird { position: absolute; left: 0; top: 12px; font-size: 32px; transition: left 2.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .bar { height: 4px; background: var(--surface-card); border-radius: 4px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 2.4s cubic-bezier(0.4, 0, 0.2, 1); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text);
      color: var(--bg);
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 13px;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      z-index: 3000;
    }
    .toast.show { display: block; animation: toastIn 0.3s ease; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      html, body { width: 100%; min-height: 100%; overflow: hidden; }
      .side { display: none; }
      .mobile-nav { display: flex; }
      .app { flex-direction: column; width: 100%; height: 100dvh; min-height: 100dvh; overflow: hidden; }
      .main { min-height: 0; height: 100%; }
      .head { height: 68px; min-height: 68px; padding: 0 16px; flex-shrink: 0; }
      .head h1 { font-size: 20px; }
      .page { min-height: 0; height: 100%; padding: 16px 12px 88px; overflow-x: hidden; overflow-y: auto; }
      .grid { display: grid; grid-template-columns: 1fr; gap: 12px; height: auto; }
      .grid > .card { min-width: 0; }
      .stats { grid-template-columns: 1fr 1fr; }
      .toast { bottom: 78px; right: 12px; left: 12px; text-align: center; }
      .bubble { max-width: 85%; }
      .mobile-nav { height: 72px; padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); padding-bottom: max(4px, env(safe-area-inset-bottom)); }
      .mobile-nav-btn { min-height: 60px; font-size: 10px; }
      .mobile-nav-btn span { font-size: 21px; line-height: 1; }

      /* Mobile chat is a real full-screen conversation, not a second column.
         It's pinned straight to the viewport instead of depending on a chain
         of parent height:100% values, so it stays correct when the keyboard
         opens and resizes the viewport. */
      .mobile-chat-active .mobile-nav { display: none; }
      .mobile-chat-active .head { display: none; }
      .mobile-chat-active .chat-container {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        width: 100%;
        border: 0;
        border-radius: 0;
        padding: 0;
        background: var(--bg);
      }
      .mobile-chat-active .chat-header { min-height: 64px; padding: 10px 14px; flex-shrink: 0; background: var(--surface); }
      .mobile-chat-active .chat-header #backToChats { display: inline-flex !important; }
      .mobile-chat-active .messages { min-height: 0; padding: 14px 12px; overscroll-behavior: contain; }
      .mobile-chat-active .composer { flex-shrink: 0; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
      .mobile-chat-active .composer .input { min-width: 0; }
      .mobile-chat-active .composer .btn { flex-shrink: 0; padding-inline: 13px; }
    }
  </style>
</head>
<body>

  <!-- AUTHENTICATION VIEW -->
  <div id="auth" class="auth">
    <div class="authbox">
      <h1>🕊️ WINGOO</h1>
      <p style="text-align:center; color:var(--muted); font-size:13px; margin-bottom:20px;">Messages that travel.</p>
      <div id="authForm"></div>
    </div>
  </div>

  <!-- MAIN APPLICATION VIEW -->
  <div id="app" class="app" style="display:none">
    
    <!-- DESKTOP SIDEBAR -->
    <aside class="side">
      <div class="logo">
        <span class="logo-icon">🕊️</span> WINGOO
      </div>
      <div class="nav-group">
        <button class="nav active" data-page="chats"><span class="nav-icon">💬</span> Chats</button>
        <button class="nav" data-page="friends"><span class="nav-icon">👥</span> Friends</button>
        <button class="nav" data-page="network"><span class="nav-icon">🗺️</span> Network</button>
        <button class="nav" data-page="profile"><span class="nav-icon">🏰</span> My Castle</button>
      </div>
      <div class="side-footer">
        <button class="nav" id="logoutBtn"><span class="nav-icon">🚪</span> Logout</button>
      </div>
    </aside>

    <!-- MAIN CONTENT STAGE -->
    <main class="main">
      <header class="head">
        <div>
          <div class="head-subtitle" id="subTitle">PRIVATE NETWORK</div>
          <h1 id="title">Chats</h1>
        </div>
        <div id="meAvatar" class="avatar">S</div>
      </header>
      
      <div class="page" id="page"></div>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="mobile-nav">
      <button class="mobile-nav-btn active" data-page="chats"><span>💬</span>Chats</button>
      <button class="mobile-nav-btn" data-page="friends"><span>👥</span>Friends</button>
      <button class="mobile-nav-btn" data-page="profile"><span>🏰</span>Castle</button>
      <button class="mobile-nav-btn" data-page="network"><span>🗺️</span>Network</button>
    </nav>
  </div>

  <!-- LOGOUT CONFIRMATION MODAL -->
  <div id="logoutModal" class="modal-overlay">

      <div style="display:flex; justify-content:center; margin-bottom: 16px;">

      </div>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">

  <!-- PIGEON FLIGHT MODAL -->
  <div class="flight" id="flight">
    <div class="flightbox">
      <button id="close" class="btn ghost" style="position:absolute; right:16px; top:16px; padding:6px 10px;">✕</button>
      <small style="color:var(--accent); font-weight:700; letter-spacing:1px;">🕊️ PIGEON DELIVERY</small>
      <h2 id="flightTitle" style="margin-top:4px;">Your pigeon has departed.</h2>
      <div class="track">
        <div class="bird" id="bird">🕊️</div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <p id="flightText" style="color:var(--muted); font-size:13px; margin-top:12px;">Making the journey…</p>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast"></div>

  <script>
    // System State
    let token = localStorage.getItem("wingooToken");
    let me = null;
    let friends = [];
    let current = null;
    let socket = null;
    let pigeon = localStorage.getItem("wingooPigeon") || "classic";
    let theme = localStorage.getItem("wingooTheme") || "golden";
    let tempAvatarBase64 = null;

    const pigeons = {
      classic: "🤍 White",
      pink: "🩷 Pink",
      black: "🖤 Black"
    };

    const pigeonIcons = {
      classic: "🕊️",
      pink: "🩷",
      black: "🖤"
    };

    const $ = s => document.querySelector(s);
    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function skeletonRows(n = 4) {
      return `<div class="card">${Array.from({ length: n }).map(() => `
        <div class="skel-row">
          <div class="skel skel-avatar"></div>
          <div class="skel-lines">
            <div class="skel skel-line" style="width:45%;"></div>
            <div class="skel skel-line" style="width:70%;"></div>
          </div>
        </div>
      `).join("")}</div>`;
    }

    // Initialize Theme
    function applyTheme(t) {
      theme = t;
      localStorage.setItem("wingooTheme", t);
      document.documentElement.setAttribute("data-theme", t);
    }
    applyTheme(theme);

    function toast(t) {
      let x = $("#toast");
      x.textContent = t;
      x.classList.add("show");
      setTimeout(() => x.classList.remove("show"), 2200);
    }

    async function api(path, opt = {}) {
      opt.headers = { ...(opt.headers || {}), "Content-Type": "application/json", Authorization: "Bearer " + token };
      let r = await fetch(path, opt);
      let d = await r.json();
      if (!r.ok) throw Error(d.error || "Request failed");
      return d;
    }

    // Authentication Setup
    function authUI() {
      let mode = "login";
      const f = $("#authForm");
      function draw() {
        f.innerHTML = `
          <h3 style="margin-bottom:12px; font-size:16px;">${mode === "login" ? "Welcome Back" : "Create Your Castle"}</h3>
          ${mode === "register" ? '<label>Display name<input id="display" class="input" placeholder="Shivang"></label>' : ''}
          <label>Username<input id="username" class="input" placeholder="@yourname"></label>
          <label>Password<input id="password" type="password" class="input" placeholder="Minimum 6 characters"></label>
          <button id="authBtn" class="btn" style="width:100%; margin-top:16px">${mode === "login" ? "Enter WINGOO" : "Create Account"}</button>
          <button id="switch" class="btn ghost" style="width:100%; margin-top:8px">${mode === "login" ? "Create a new account" : "I already have an account"}</button>
        `;
        
        $("#authBtn").onclick = async () => {
          try {
            let body = { username: $("#username").value, password: $("#password").value };
            if (mode === "register") body.displayName = $("#display").value;
            let d = await fetch("/api/auth/" + mode, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
            }).then(r => r.json());
            
            if (!d.token) throw Error(d.error);
            token = d.token;
            localStorage.setItem("wingooToken", token);
            await boot();
          } catch (e) { toast(e.message); }
        };
        $("#switch").onclick = () => { mode = mode === "login" ? "register" : "login"; draw(); };
      }
      draw();
    }

    // App Bootstrapper
    async function boot() {
      if (!token) {
        $("#auth").style.display = "grid";
        $("#app").style.display = "none";
        authUI();
        return;
      }
      try {
        let d = await api("/api/me");
        me = d.user;
        $("#auth").style.display = "none";
        $("#app").style.display = "flex";
        renderAvatar($("#meAvatar"), me);
        connectSocket();
        loadPage("chats");
      } catch (e) {
        localStorage.removeItem("wingooToken");
        token = null;
        authUI();
      }
    }

    // Resizes + compresses a picked image client-side so phone-camera photos
    // (often several MB) don't get sent raw and rejected by the server.
    function compressImage(file, maxSize = 480, quality = 0.82) {
      return new Promise((resolve, reject) => {
        let reader = new FileReader();
        reader.onload = ev => {
          let img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height) {
              if (width > maxSize) { height = Math.round(height * (maxSize / width)); width = maxSize; }
            } else {
              if (height > maxSize) { width = Math.round(width * (maxSize / height)); height = maxSize; }
            }
            let canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = () => reject(new Error("Could not read that image."));
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error("Could not read that file."));
        reader.readAsDataURL(file);
      });
    }

    function renderAvatar(container, user) {
      if (user.avatar && user.avatar.startsWith("data:image")) {
        container.innerHTML = `<img src="${user.avatar}" alt="Avatar">`;
      } else {
        container.textContent = user.avatar || (user.displayName ? user.displayName[0].toUpperCase() : "U");
      }
    }

    function connectSocket() {
      if (socket) socket.disconnect();
      socket = io({ auth: { token } });
      socket.on("message:new", m => {
        toast("🕊️ New message from @" + m.sender);
        if (current && current.username === m.sender) loadChat(current.username);
      });
    }

    // Navigation Router
    async function loadPage(page, options = {}) {
      document.body.classList.remove("mobile-chat-active");
      document.querySelectorAll(".nav, .mobile-nav-btn").forEach(x => {
        x.classList.toggle("active", x.dataset.page === page);
      });

      let pageEl = $("#page");
      pageEl.classList.remove("page-in");
      void pageEl.offsetWidth; // restart animation
      pageEl.classList.add("page-in");
      
      const titles = { chats: "Chats", friends: "Friends & Circle", network: "Pigeon Network", profile: "My Castle" };
      const subtitles = { chats: "MESSAGES", friends: "COMMUNITY", network: "MAP", profile: "CASTLE PROFILE" };
      
      $("#title").textContent = titles[page] || "WINGOO";
      $("#subTitle").textContent = subtitles[page] || "NETWORK";

      if (page === "network") network();
      if (page === "chats") chats(Boolean(options.openCurrent));
      if (page === "friends") friendsPage();
      if (page === "profile") profile();
    }

    // Views Implementation
    async function network() {
      if (!friends.length) $("#page").innerHTML = skeletonRows(2);
      await refreshFriends();
      $("#page").innerHTML = `
        <div class="grid">
          <div class="card">
            <small style="color:var(--accent); font-weight:700;">🕊️ LIVE NETWORK</small>
            <h2 style="margin: 8px 0 12px;">Every friend is a castle.</h2>
            <p style="color:var(--muted); line-height:1.6; font-size:13px; margin-bottom:16px;">
              Real accounts and protected locations power your network connections.
            </p>
            <button class="btn" id="loc" style="width:100%;">📍 Share Location</button>
          </div>
          <div class="map">
            <div class="node you">
              🏰 <b>${esc(me.displayName)}</b>
              <small style="display:block; color:var(--accent); font-size:10px;">you</small>
            </div>
            ${friends.map((f, i) => `
              <button class="node ${["r", "a", "n", "as"][i % 4]}" data-user="${esc(f.username)}">
                🏠 <b>${esc(f.displayName)}</b>
                <small style="display:block; color:var(--muted); font-size:10px;">${f.distance == null ? "distance hidden" : "~" + f.distance + " km"}</small>
              </button>
            `).join("")}
          </div>
        </div>
        <div class="stats">
          <div class="stat"><small>Friends</small><b>${friends.length}</b></div>
          <div class="stat"><small>Location</small><b>${me.locationVisibility === "hidden" ? "Hidden" : "Private"}</b></div>
          <div class="stat"><small>Realtime</small><b>ACTIVE</b></div>
          <div class="stat"><small>Exact Coords</small><b>Protected</b></div>
        </div>`;

      $("#loc").onclick = shareLocation;
      document.querySelectorAll("[data-user]").forEach(x => x.onclick = () => {
        current = friends.find(a => a.username === x.dataset.user);
        loadPage("chats", { openCurrent: true });
      });
    }

    async function refreshFriends() {
      try {
        friends = (await api("/api/friends")).friends || [];
      } catch (e) { friends = []; }
    }

    // FRIEND REQUEST & CIRCLE SYSTEM
    async function friendsPage() {
      if (!friends.length) $("#page").innerHTML = skeletonRows(3);
      await refreshFriends();
      let incoming = [];
      try {
        incoming = (await api("/api/friend-requests")).requests || [];
      } catch (e) { console.error("Could not load friend requests:", e); }

      const render = () => {
        $("#page").innerHTML = `
          ${incoming.length ? `
            <div class="card request-card" style="margin-bottom: 20px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
                <h2 style="font-size: 16px;">📨 Incoming Friend Requests</h2>
                <span class="request-badge">${incoming.length} New</span>
              </div>
              <div style="display:flex; flex-direction:column; gap:8px;">
                ${incoming.map(r => `
                  <div class="row" style="background:var(--surface); border:1px solid var(--border-accent);">
                    <div class="avatar" id="req-av-${esc(r.username)}"></div>
                    <div>
                      <b style="font-size:14px;">${esc(r.display_name)}</b>
                      <small style="display:block; color:var(--muted); font-size:11px;">@${esc(r.username)}</small>
                    </div>
                    <div class="spacer" style="display:flex; gap:8px;">
                      <button class="btn" data-accept="${esc(r.username)}">Accept</button>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
          ` : ""}

          <div class="card">
            <h2 style="font-size: 16px; margin-bottom: 12px;">Find a Friend</h2>
            <div class="search">
              <input id="q" class="input" placeholder="Search by @username...">
              <button class="btn" id="search">Search</button>
            </div>
            <div id="results" style="margin-top: 12px; display:flex; flex-direction:column; gap:8px;"></div>
          </div>

          <div class="card" style="margin-top:20px;">
            <h2 style="font-size: 16px; margin-bottom: 12px;">Your Circle (${friends.length})</h2>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${friends.map(f => `
                <div class="row">
                  <div class="avatar" id="fr-av-${esc(f.username)}"></div>
                  <div>
                    <b style="font-size:14px;">${esc(f.displayName)}</b>
                    <small style="display:block; color:var(--muted); font-size:11px;">
                      @${esc(f.username)} · ${f.distance == null ? "location hidden" : f.distance + " km away"}
                    </small>
                  </div>
                  <button class="btn ghost spacer" data-chat="${esc(f.username)}">Message</button>
                </div>
              `).join("") || `
                <div class="empty-state" style="padding:24px 12px;">
                  <div class="empty-icon">🏰</div>
                  <div class="empty-title">Your circle is empty</div>
                  <div class="empty-sub">Search for a username above to send your first friend request.</div>
                </div>
              `}
            </div>
          </div>`;

        // Populate Avatars
        incoming.forEach(r => renderAvatar($(`#req-av-${r.username}`), { avatar: r.avatar, displayName: r.display_name }));
        friends.forEach(f => renderAvatar($(`#fr-av-${f.username}`), f));

        // ACCEPT FRIEND REQUEST HANDLER
        document.querySelectorAll("[data-accept]").forEach(b => b.onclick = async () => {
          b.disabled = true;
          b.textContent = "Accepting…";
          try {
            await api("/api/friends/accept", {
              method: "POST",
              body: JSON.stringify({ username: b.dataset.accept })
            });
            toast("👥 Friend request accepted!");
            await friendsPage();
          } catch (e) {
            b.disabled = false;
            b.textContent = "Accept";
            toast(e.message);
          }
        });

        // SEARCH USER HANDLER
        $("#search").onclick = async () => {
          try {
            let query = $("#q").value.trim();
            if(!query) return;
            let d = await api("/api/users/search?q=" + encodeURIComponent(query));
            $("#results").innerHTML = d.users.map(u => `
              <div class="row" style="background:var(--surface-card);">
                <div class="avatar" id="sr-av-${esc(u.username)}"></div>
                <div>
                  <b style="font-size:14px;">${esc(u.displayName)}</b>
                  <small style="display:block; color:var(--muted); font-size:11px;">
                    @${esc(u.username)} ${u.distance != null ? "· " + u.distance + " km" : ""}
                  </small>
                </div>
                <button class="btn spacer" data-add="${esc(u.username)}">Add</button>
              </div>
            `).join("") || `
              <div class="empty-state" style="padding:20px 12px;">
                <div class="empty-icon">🔍</div>
                <div class="empty-sub">No one found with that username.</div>
              </div>
            `;

            d.users.forEach(u => renderAvatar($(`#sr-av-${u.username}`), u));

            document.querySelectorAll("[data-add]").forEach(b => b.onclick = async () => {
              try {
                await api("/api/friends/request", {
                  method: "POST",
                  body: JSON.stringify({ username: b.dataset.add })
                });
                b.textContent = "Requested ✓";
                b.disabled = true;
              } catch (e) {
                if (e.message === "A request already exists.") {
                  b.textContent = "Requested ✓";
                  b.disabled = true;
                }
                toast(e.message);
              }
            });
          } catch (e) { toast(e.message); }
        };

        document.querySelectorAll("[data-chat]").forEach(b => b.onclick = () => {
          current = friends.find(x => x.username === b.dataset.chat);
          loadPage("chats", { openCurrent: true });
        });
      };

      render();
    }

    // CHATS & MESSAGING VIEW
    async function chats(openCurrent = false) {
      if (!friends.length) $("#page").innerHTML = skeletonRows(3);
      await refreshFriends();
      if (!current && friends.length > 0 && (window.innerWidth > 768 || openCurrent)) current = friends[0];

      $("#page").innerHTML = `
        <div class="grid">
          <div class="card" style="display:flex; flex-direction:column; gap:8px;">
            <div style="font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px;">RECENT MESSAGES</div>
            ${friends.map(f => `
              <div class="row" data-open="${esc(f.username)}" style="cursor:pointer; ${current && current.username === f.username ? 'background:var(--surface-hover); border:1px solid var(--border-accent);' : ''}">
                <div class="avatar" id="ch-av-${esc(f.username)}"></div>
                <div>
                  <b style="font-size:14px;">${esc(f.displayName)}</b>
                  <small style="display:block; color:var(--muted); font-size:11px;">@${esc(f.username)}</small>
                </div>
              </div>
            `).join("") || `
              <div class="empty-state" style="padding:32px 12px;">
                <div class="empty-icon">🕊️</div>
                <div class="empty-title">No messages yet</div>
                <div class="empty-sub">Add a friend from the Friends tab to send your first pigeon.</div>
              </div>
            `}
          </div>
          <div class="card chat-container" id="chat">
            <div class="empty-state" style="margin:auto;">
              <div class="empty-icon">✉️</div>
              <div class="empty-title">Select a conversation</div>
              <div class="empty-sub">Pick a friend on the left to read your letters.</div>
            </div>
          </div>
        </div>`;

      friends.forEach(f => renderAvatar($(`#ch-av-${f.username}`), f));

      document.querySelectorAll("[data-open]").forEach(x => x.onclick = () => {
        current = friends.find(f => f.username === x.dataset.open);
        chats(true);
      });

      if (current && (window.innerWidth > 768 || openCurrent)) loadChat(current.username);
    }

    async function loadChat(username) {
      current = friends.find(f => f.username === username) || current;
      if (!current) return;
      
      document.body.classList.add("mobile-chat-active");
      
      let d = await api("/api/messages/" + encodeURIComponent(username));
      $("#chat").innerHTML = `
        <div class="chat-header">
          <button class="btn ghost" id="backToChats" style="display:none; padding:6px 10px;">←</button>
          <div class="avatar" id="activeChatAvatar"></div>
          <div>
            <b style="font-size:14px; display:block;">${esc(current.displayName)}</b>
            <small style="color:var(--green); font-size:11px;">
              ${current.distance == null ? "location hidden" : current.distance + " km away"}
            </small>
          </div>
        </div>
        <div class="messages" id="messageList">
          ${d.messages.map(m => `
            <div class="bubble ${m.sender === me.username ? "me" : ""}">
              ${esc(m.body)}
              <small>${pigeonIcons[m.pigeon_id] || "🕊️"} · ${new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</small>
            </div>
          `).join("")}
        </div>
        <div class="composer">
          <input id="msg" class="input" placeholder="Write a message via ${pigeons[pigeon]}…">
          <button class="btn" id="send">Send ${pigeonIcons[pigeon]}</button>
        </div>`;

      renderAvatar($("#activeChatAvatar"), current);

      let msgList = $("#messageList");
      msgList.scrollTop = msgList.scrollHeight;

      if (window.innerWidth <= 768) {
        let backBtn = $("#backToChats");
        if (backBtn) {
          backBtn.style.display = "inline-flex";
          backBtn.onclick = () => {
            document.body.classList.remove("mobile-chat-active");
            loadPage("chats");
          };
        }
      }

      $("#send").onclick = send;
      $("#msg").onkeydown = e => { if (e.key === "Enter") send(); };
    }

    async function send() {
      let x = $("#msg").value.trim();
      if (!x || !current) return;
      let btn = $("#send");
      let original = btn.textContent;
      btn.disabled = true;
      try {
        await api("/api/messages", {
          method: "POST",
          body: JSON.stringify({ username: current.username, body: x, pigeonId: pigeon })
        });
        $("#msg").value = "";
        showFlight(current);
        await loadChat(current.username);
      } catch (e) {
        toast(e.message);
        btn.disabled = false;
        btn.textContent = original;
      }
    }

    function showFlight(f) {
      $("#flightTitle").textContent = "Your pigeon has departed.";
      $("#flightText").textContent = "Flying to " + f.displayName + "…";
      $("#bird").textContent = pigeonIcons[pigeon] || "🕊️";
      $("#bird").style.left = "0";
      $("#bar").style.width = "0";
      $("#flight").classList.add("show");
      
      setTimeout(() => {
        $("#bird").style.left = "85%";
        $("#bar").style.width = "100%";
      }, 100);

      setTimeout(() => {
        $("#flightText").textContent = "Delivered ✨";
        toast("🕊️ Delivered to " + f.displayName);
        setTimeout(() => $("#flight").classList.remove("show"), 700);
      }, 2500);
    }

    // MY CASTLE / PROFILE VIEW
    async function profile() {
      if (!me) $("#page").innerHTML = skeletonRows(1);
      let d = await api("/api/me");
      me = d.user;
      
      $("#page").innerHTML = `
        <div class="card" style="max-width:650px; margin:0 auto;">
          <div class="castle-hero">
            <div class="castle-avatar-wrap" id="editAvatarBtn">
              <div class="castle-avatar" id="castleAvatar"></div>
              <div class="castle-avatar-badge">✏️</div>
            </div>
            <h2 style="font-family:var(--font-display); font-size:24px; font-weight:600; margin-bottom:2px;">${esc(me.displayName)}</h2>
            <p style="color:var(--muted); font-size:13px;">@${esc(me.username)}</p>
            <p style="color:var(--accent); font-size:12px; font-style:italic; margin-top:6px;">"Messages that travel."</p>

            <div class="castle-metrics">
              <div class="metric">
                <div class="metric-val">${friends.length}</div>
                <div class="metric-lbl">Friends</div>
              </div>
              <div class="metric">
                <div class="metric-val">🕊️ 247</div>
                <div class="metric-lbl">Pigeons Sent</div>
              </div>
              <div class="metric">
                <div class="metric-val">📍 842</div>
                <div class="metric-lbl">km Travelled</div>
              </div>
            </div>
          </div>

          <div style="display:flex; flex-direction:column; gap:16px;">
            <label style="display:block;">
              <span style="color:var(--muted); font-size:12px; font-weight:600;">Display Name</span>
              <input id="name" class="input" value="${esc(me.displayName)}" style="margin-top:6px;">
            </label>

            <label style="display:block;">
              <span style="color:var(--muted); font-size:12px; font-weight:600;">Location Visibility</span>
              <select id="vis" class="input" style="margin-top:6px;">
                <option value="approximate">Approximate Distance</option>
                <option value="friends">Friends Only</option>
                <option value="hidden">Hidden</option>
              </select>
            </label>

            <div>
              <span style="color:var(--muted); font-size:12px; font-weight:600; display:block; margin-bottom:8px;">🎨 Theme Accent</span>
              <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;">
                <button class="btn ghost ${theme==='golden'?'active':''}" data-theme-btn="golden">🟡 Gold</button>
                <button class="btn ghost ${theme==='sage'?'active':''}" data-theme-btn="sage">🟢 Sage</button>
                <button class="btn ghost ${theme==='plum'?'active':''}" data-theme-btn="plum">🟣 Plum</button>
                <button class="btn ghost ${theme==='ocean'?'active':''}" data-theme-btn="ocean">🔵 Ocean</button>
              </div>
            </div>

            <div>
              <span style="color:var(--muted); font-size:12px; font-weight:600; display:block; margin-bottom:8px;">🕊️ Signature Pigeon</span>
              <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
                ${Object.entries(pigeons).map(([k, v]) => `
                  <button class="btn ghost ${pigeon === k ? 'active' : ''}" data-pigeon="${k}">${v}</button>
                `).join("")}
              </div>
            </div>

            <button class="btn" id="save" style="width:100%; margin-top:12px;">Save Castle Settings</button>
          </div>
        </div>`;

      renderAvatar($("#castleAvatar"), me);
      $("#vis").value = me.locationVisibility || "approximate";

      // Event Listeners for Castle Settings
      $("#editAvatarBtn").onclick = () => {
        tempAvatarBase64 = null;
        renderAvatar($("#photoPreview"), me);
        $("#photoModal").classList.add("show");
      };

      document.querySelectorAll("[data-theme-btn]").forEach(b => {
        b.onclick = () => {
          applyTheme(b.dataset.themeBtn);
          profile();
        };
      });

      document.querySelectorAll("[data-pigeon]").forEach(b => {
        b.onclick = () => {
          pigeon = b.dataset.pigeon;
          localStorage.setItem("wingooPigeon", pigeon);
          toast("🕊️ Pigeon updated to " + pigeons[pigeon]);
          profile();
        };
      });

      $("#save").onclick = async () => {
        try {
          let body = { displayName: $("#name").value, locationVisibility: $("#vis").value };
          let d = await api("/api/me", { method: "PATCH", body: JSON.stringify(body) });
          me = d.user;
          renderAvatar($("#meAvatar"), me);
          toast("🏰 Castle updated successfully");
        } catch (e) { toast(e.message); }
      };
    }

    // LOCATION SHARING
    async function shareLocation() {
      if (!navigator.geolocation) return toast("Geolocation is unavailable.");
      navigator.geolocation.getCurrentPosition(async p => {
        try {
          await api("/api/location", {
            method: "POST",
            body: JSON.stringify({ lat: p.coords.latitude, lng: p.coords.longitude })
          });
          toast("📍 Location updated privately.");
          network();
        } catch (e) { toast(e.message); }
      }, () => toast("Location permission denied."));
    }

    // AVATAR MODAL HANDLERS
    $("#pickPhotoBtn").onclick = () => $("#photoInput").click();
    $("#photoInput").onchange = async e => {
      let file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) return toast("Please choose an image file.");
      try {
        tempAvatarBase64 = await compressImage(file);
        $("#photoPreview").innerHTML = `<img src="${tempAvatarBase64}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
      } catch (err) {
        toast(err.message);
      }
    };
    $("#cancelPhoto").onclick = () => $("#photoModal").classList.remove("show");
    $("#savePhotoBtn").onclick = async () => {
      if (!tempAvatarBase64) { $("#photoModal").classList.remove("show"); return; }
      let btn = $("#savePhotoBtn");
      btn.disabled = true;
      btn.textContent = "Saving…";
      try {
        let d = await api("/api/me", { method: "PATCH", body: JSON.stringify({ avatar: tempAvatarBase64 }) });
        me = d.user;
        tempAvatarBase64 = null;
        renderAvatar($("#meAvatar"), me);
        if ($("#castleAvatar")) renderAvatar($("#castleAvatar"), me);
        toast("🕊️ Profile photo updated!");
        $("#photoModal").classList.remove("show");
      } catch (e) {
        toast(e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Save Photo";
      }
    };

    // LOGOUT MODAL HANDLERS
    $("#logoutBtn").onclick = () => $("#logoutModal").classList.add("show");
    $("#cancelLogout").onclick = () => $("#logoutModal").classList.remove("show");
    $("#confirmLogout").onclick = () => {
      localStorage.removeItem("wingooToken");
      location.reload();
    };

    // GENERAL BINDINGS
    document.querySelectorAll(".nav[data-page], .mobile-nav-btn[data-page]").forEach(n => {
      n.onclick = () => loadPage(n.dataset.page);
    });
    $("#close").onclick = () => $("#flight").classList.remove("show");

    // BOOTSTRAP APPLICATION
    boot();
  </script>
</body>
</html>
